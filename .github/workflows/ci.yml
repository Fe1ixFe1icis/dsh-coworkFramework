name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Static checks
        run: npm run check

      - name: Unit and two-machine smoke tests
        run: npm test

      - name: Plugin tests
        run: npm run test:plugin

  package:
    name: Package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build release archive
        run: npm run package

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cowork-framework
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 7
          if-no-files-found: error
